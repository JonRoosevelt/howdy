<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Howdy chat</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; font-size: 16px; line-height: 1.5; }
    header { display: flex; align-items: center; gap: 6px; padding: 14px 16px 10px; }
    header .logo { flex: 1; font-size: 22px; }
    header button { border: 0; background: none; color: var(--ink-2); font-size: 18px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    header button:hover { background: var(--pink-wash); color: var(--ink); }
    #log { flex: 1; overflow-y: auto; padding: 6px 18px 18px; }
    #log:empty::before { content: 'Ask about this page, your day, your email or Slack. Ask for a report and it opens as a page in a new tab.'; font-style: italic; color: var(--ink-3); }
    .msg { white-space: pre-wrap; margin: 0 0 16px; overflow-wrap: anywhere; }
    .msg.user { background: var(--blue); color: var(--on-blue); padding: 10px 15px; border-radius: 20px 20px 4px 20px; margin-left: 3rem; }
    .msg.error { color: var(--error); }
    .msg h1, .msg h2, .msg h3 { font: italic 700 18px/1.3 var(--font); margin: .6em 0 .2em; white-space: normal; }
    .msg li { margin-left: 1.1em; }
    .msg code { font: 13px ui-monospace, Menlo, monospace; background: var(--paper-2); padding: 0 4px; border-radius: 4px; }
    .msg a { text-decoration: underline wavy var(--pink); text-underline-offset: 3px; }
    #status { margin: 0; padding: 0 18px 8px; font: italic 14px var(--font); color: var(--pink-ink); min-height: 1.5em; }
    form { margin: 0 14px 14px; border: 2px solid var(--ink); border-radius: 20px; padding: 8px 12px; }
    form:focus-within { box-shadow: 4px 4px 0 var(--pink); }
    textarea, textarea:focus-visible { display: block; width: 100%; resize: none; background: none; border: 0; outline: none; }
    textarea::placeholder { color: var(--ink-3); }
  </style>
</head>
<body>
  <header>
    <span class="logo">Howdy</span>
    <button id="reset" title="New chat" aria-label="New chat">↺</button>
    <button id="close" title="Close" aria-label="Close">×</button>
  </header>
  <div id="log"></div>
  <p id="status"></p>
  <form id="form"><textarea id="q" rows="3" placeholder="Ask anything, Enter to send"></textarea></form>
  <script type="module" src="chat.js"></script>
</body>
</html>
